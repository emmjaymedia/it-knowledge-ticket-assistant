services:
  vector:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: servicedesk
      POSTGRES_PASSWORD: local-development
      POSTGRES_DB: servicedesk
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - vector-data:/var/lib/postgresql/data
volumes:
  vector-data:
